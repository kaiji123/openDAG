<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #f7f7f4; font-family: "Inter", sans-serif; }
    #net-cam { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; }
    #net-video { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; object-fit: cover; }
    #net-cursor { position: absolute; left: 0; top: 0; width: 34px; height: 46px; transform-origin: 3px 3px; }
    .net-cap { position: absolute; left: 72px; bottom: 64px; padding: 22px 34px 24px; border-radius: 18px; background: #1d2327;
      color: #ffffff; font-size: 44px; font-weight: 800; letter-spacing: -0.015em; white-space: nowrap; opacity: 0;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.18); }
    .net-cap span { color: #f0b23c; }
  </style>
  <div id="root" data-composition-id="network" data-width="1920" data-height="1080">
    <div id="net-cam">
      <!-- the network take; data-media-start skips to just before the cursor heads for "Network" -->
      <video id="net-video" class="clip" src="assets/rec/network.mp4" muted playsinline
        data-start="0" data-duration="14.6" data-media-start="1.2" data-track-index="0"></video>
      <svg id="net-cursor" viewBox="0 0 17 23" aria-hidden="true"><path d="M1.5 1.5 L1.5 18.5 L5.6 14.6 L8.4 21.2 L11.4 19.9 L8.7 13.4 L14.4 13.4 Z" fill="#1d2327" stroke="#ffffff" stroke-width="1.6" stroke-linejoin="round" /></svg>
    </div>
    <div id="net-c1" class="net-cap">Every study, one <span>connected web</span></div>
    <div id="net-c2" class="net-cap">Socioeconomic status, across <span>8 studies</span></div>
  </div>
  <script>
    (function () {
      const T = window.TRACK_NET, K = 1920 / T.w;
      const S0 = 1.2;                                  // source time at this scene's 0 (data-media-start)
      const at = (src) => src - S0;
      const moves = T.events.filter((e) => e.x !== undefined);
      const clicks = T.events.filter((e) => e.click).map((e) => e.t);
      const cursor = document.getElementById("net-cursor");
      const S = { t: 0 };
      function render() {
        const t = S.t + S0;
        if (!moves.length || t < moves[0].t) { cursor.style.opacity = 0; return; }
        let i = 0;
        while (i < moves.length - 1 && moves[i + 1].t <= t) i++;
        const a = moves[i], b = moves[Math.min(i + 1, moves.length - 1)];
        const u = b.t > a.t ? Math.min(1, Math.max(0, (t - a.t) / (b.t - a.t))) : 0;
        const x = (a.x + (b.x - a.x) * u) * K, y = (a.y + (b.y - a.y) * u) * K;
        let press = 1;
        for (const c of clicks) { const d = t - c; if (d >= 0 && d < 0.22) press = Math.min(press, 0.82 + 0.18 * Math.abs(d - 0.07) / 0.15); }
        cursor.style.opacity = 1;
        cursor.style.transform = `translate(${x - 3}px, ${y - 3}px) scale(${press})`;
      }
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(S, { t: 0 }, { t: 14.6, duration: 14.6, ease: "none", onUpdate: render }, 0);
      tl.fromTo("#net-cam", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, 0);

      const cam = (fx, fy, s) => {
        const x = Math.min(0, Math.max(1920 - 1920 * s, 960 - fx * K * s));
        const y = Math.min(0, Math.max(1080 - 1080 * s, 540 - fy * K * s));
        return { x, y, scale: s };
      };
      gsap.set("#net-cam", cam(900, 120, 1.5));                         // the menu: the cursor heads for "Network"
      const move = (src, dur, fx, fy, s, ease = "power2.inOut") => tl.to("#net-cam", { ...cam(fx, fy, s), duration: dur, ease }, at(src));
      move(2.85, 0.6, 720, 405, 1);         // the network page opens
      move(6.4, 0.7, 600, 470, 1.3);        // the web, turning, with its labels
      move(11.75, 0.7, 760, 480, 1.18);     // PPI use lit up, its four studies in the side panel

      const cap = (sel, a, b) => {
        tl.fromTo(sel, { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.out" }, at(a));
        tl.to(sel, { opacity: 0, filter: "blur(8px)", duration: 0.15, ease: "power3.in" }, at(b));
      };
      cap("#net-c1", 6.6, 9.3);
      cap("#net-c2", 12.1, 15.7);
      render();
      window.__timelines["network"] = tl;
    })();
  </script>
</template>
