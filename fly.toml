# fly launch --no-deploy --copy-config ; fly volumes create opendag_data --size 1 ; fly deploy
app = "opendag"
primary_region = "lhr"

[build]

[env]
  DB_PATH = "/data/opendag.db"

[[mounts]]
  source = "opendag_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    path = "/api/health"
    interval = "30s"
    timeout = "5s"
